<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanadium.Note.Web</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Vanadium.Note.Web.styles.css" rel="stylesheet" />
    <!-- MUST stay empty. The .NET SDK injects the Blazor framework import map
         into this element during build/publish (OverrideHtmlAssetPlaceholders),
         mapping "./_framework/dotnet.js" to the fingerprinted
         "./_framework/dotnet.<hash>.js" plus the matching SRI integrity table.
         The SDK only fills an EMPTY importmap element -- writing our own map
         here makes it skip injection, the fingerprint mapping disappears, the
         runtime requests the non-existent "/_framework/dotnet.js", nginx serves
         index.html for it and the app hangs on the loading spinner.
         Editor dependencies (issue #307) therefore do NOT use an import map:
         wwwroot/js/tiptap/** imports the self-hosted bundles under
         wwwroot/js/vendor/ by their "/js/vendor/..." URL directly. -->
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="js/keyboard-shortcuts.js"></script>
    <script src="js/token-sync.js"></script>
    <script src="js/focus-trap.js"></script>
    <script src="js/quick-nav.js"></script>
    <script src="js/unsaved-changes.js"></script>
    <script type="module" src="js/tiptap-editor.js"></script>
    <script src="js/board-drag-drop.js"></script>
    <script src="js/theme-init.js"></script>
</body>

</html>
