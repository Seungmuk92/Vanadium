<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanadium.Note.Web</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Vanadium.Note.Web.styles.css" rel="stylesheet" />
    <!-- Editor dependency import map (issue #307). Maps the bare specifiers used
         by the Tiptap/Mermaid ES modules to self-hosted bundles under
         wwwroot/js/vendor/, built by `npm run build` (see build/bundle.mjs).
         Keep in sync with wwwroot/js/vendor/importmap.json. -->
    <script type="importmap">
    {
      "imports": {
        "@tiptap/core": "/js/vendor/tiptap-core.js",
        "@tiptap/pm/state": "/js/vendor/tiptap-pm-state.js",
        "@tiptap/pm/view": "/js/vendor/tiptap-pm-view.js",
        "@tiptap/starter-kit": "/js/vendor/tiptap-starter-kit.js",
        "@tiptap/suggestion": "/js/vendor/tiptap-suggestion.js",
        "@tiptap/extension-bubble-menu": "/js/vendor/tiptap-extension-bubble-menu.js",
        "@tiptap/extension-placeholder": "/js/vendor/tiptap-extension-placeholder.js",
        "@tiptap/extension-link": "/js/vendor/tiptap-extension-link.js",
        "@tiptap/extension-image": "/js/vendor/tiptap-extension-image.js",
        "@tiptap/extension-task-list": "/js/vendor/tiptap-extension-task-list.js",
        "@tiptap/extension-task-item": "/js/vendor/tiptap-extension-task-item.js",
        "@tiptap/extension-table": "/js/vendor/tiptap-extension-table.js",
        "@tiptap/extension-table-row": "/js/vendor/tiptap-extension-table-row.js",
        "@tiptap/extension-table-header": "/js/vendor/tiptap-extension-table-header.js",
        "@tiptap/extension-table-cell": "/js/vendor/tiptap-extension-table-cell.js",
        "@tiptap/extension-code-block-lowlight": "/js/vendor/tiptap-extension-code-block-lowlight.js",
        "@tiptap/extension-heading": "/js/vendor/tiptap-extension-heading.js",
        "tiptap-markdown": "/js/vendor/tiptap-markdown.js",
        "lowlight": "/js/vendor/lowlight.js",
        "mermaid": "/js/vendor/mermaid.js"
      }
    }
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="js/keyboard-shortcuts.js"></script>
    <script src="js/token-sync.js"></script>
    <script src="js/focus-trap.js"></script>
    <script src="js/quick-nav.js"></script>
    <script src="js/unsaved-changes.js"></script>
    <script type="module" src="js/tiptap-editor.js"></script>
    <script src="js/theme-init.js"></script>
</body>

</html>
