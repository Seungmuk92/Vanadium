server {
    listen 80;

    # Content-Security-Policy: second line of defense behind the server-side HTML
    # sanitizer for stored-note XSS (issue #199). The critical property is that
    # script-src does NOT contain 'unsafe-inline': an injected inline <script> or
    # inline event handler (onerror=, onclick=, ...) in stored note HTML cannot
    # execute even if it survives the sanitizer, and javascript: URIs are blocked.
    #
    # Everything the Blazor WASM front-end legitimately needs is allowlisted:
    #   - 'wasm-unsafe-eval' — the .NET WASM runtime compiles WebAssembly.
    #   - '__IMPORTMAP_SHA256__' — the ONE inline script on the page: the
    #     <script type="importmap"> that the .NET SDK fills at publish time with
    #     the framework fingerprint map (./_framework/dotnet.js ->
    #     ./_framework/dotnet.<hash>.js). Without it the runtime requests the
    #     non-existent /_framework/dotnet.js, the SPA fallback answers with
    #     index.html and the app hangs on the loading spinner. The placeholder is
    #     replaced with the real hash during the image build
    #     (build/csp-importmap-hash.cs); a hash source allows exactly that one
    #     script and nothing else, so the no-'unsafe-inline' guarantee above
    #     still holds. Editor modules are NOT in the map — they are imported by
    #     their /js/vendor/... URL precisely so this stays a single-entry map.
    # The Tiptap/ProseMirror/lowlight/Mermaid editor stack is now self-hosted as
    # bundled ES modules under wwwroot/js/vendor/ (issue #307), so script-src no
    # longer allows any external CDN (esm.sh / cdn.jsdelivr.net) and no longer
    # needs 'unsafe-eval' — every module loads same-origin from 'self'. This is
    # the tightest script-src compatible with the WASM runtime.
    # style-src allows 'unsafe-inline' because MudBlazor and Blazor inject inline
    # styles (not a script-execution vector). img-/font-/connect-src are kept
    # permissive because embedded images/attachments and the API live on a
    # separate, deployment-configurable origin (API_BASE_URL) not known at build
    # time; these are not inline-script vectors, so breadth here does not weaken
    # the anti-XSS guarantee above.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' '__IMPORTMAP_SHA256__'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self' https: http:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Stricter, dedicated CSP for the anonymous share surface (issue #293).
    # /share/{token} is served by the same Blazor WASM app, so it still needs the
    # WASM runtime ('wasm-unsafe-eval') and the self-hosted editor modules from
    # 'self' — script-src is therefore identical to the global policy. Two
    # tightenings are safe here and matter specifically for anonymous viewers:
    #   - img-src drops the broad https:/http: allowance so a shared note whose
    #     (sanitized-but-still-permitted) HTML embeds an external <img> cannot
    #     beacon the anonymous viewer's IP/User-Agent to a third-party host.
    #     Embedded note images/attachments live on the authenticated API origin
    #     an anonymous viewer cannot load anyway (Share.razor swaps them for
    #     placeholders), so no legitimate image is lost.
    #   - form-action is 'none': the read-only share page submits no forms.
    # nginx does NOT inherit the server-level add_header into a location that
    # defines its own add_header, so this block fully replaces the CSP above for
    # /share/* (the only server-level header is that CSP), and the SPA fallback
    # serves index.html for the client-side /share/{token} route.
    location /share/ {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' '__IMPORTMAP_SHA256__'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: http:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
